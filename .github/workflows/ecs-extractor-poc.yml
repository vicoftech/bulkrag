name: ECS Extractor POC — CI/CD

on:
  push:
    branches: [main, develop, development]
    paths:
      - "ecs-extractor/**"
      - "terraform/**"
      - ".github/workflows/ecs-extractor-poc.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "ecs-extractor/**"
      - "terraform/**"
      - ".github/workflows/ecs-extractor-poc.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno destino"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: rag-ecs-extractor
  TF_MODULE_PATH: terraform/modules/ecs_extractor
  TF_WORKING_DIR: terraform/envs/${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Prepare tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: cp terraform.tfvars.github terraform.tfvars

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

  docker:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    needs: terraform
    environment: development
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ecs-extractor/extractor
        run: |
          docker build \
            --tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:latest \
            --tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }} \
            .

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}

      - name: Update ECS Task Definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json "$(aws ecs describe-task-definition \
              --task-definition rag-extractor-poc-dev \
              --query 'taskDefinition' \
              --output json \
              | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
              | jq '.containerDefinitions[0].image = "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}"')"

      - name: Summary
        run: |
          echo "### Deploy completado" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen:** ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
